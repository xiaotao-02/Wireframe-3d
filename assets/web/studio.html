<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wireframe-3d</title><link rel="icon" href="data:,"><link rel="stylesheet" href="preview-ui.css"><style>.detail-text{font-size:13px;line-height:1.8;color:#7a838b}.detail-name{font-size:20px;margin:22px 0 12px}.small{font-size:12px;line-height:1.7;color:#7a838b}.mode-note{max-width:540px}.transport>button{white-space:nowrap}#status{font-size:11px;padding:0 12px;color:#77818a}.app-header h1{font-size:20px}@media(max-width:700px){.app-header h1{font-size:16px}#status{display:none}}</style><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/controls/OrbitControls.js":"./vendor/OrbitControls.js"}}</script></head>
<body><header class="app-header"><div class="heading"><div class="eyebrow">WIREFRAME / STRUCTURE STUDIO</div><h1 id="title">正在生成场景</h1></div><div class="header-spacer"></div></header><main class="preview-layout"><div id="stage"><div id="error" role="alert" hidden></div><div class="hint">拖动旋转 · 滚轮缩放 · 点选部件</div></div><aside id="panel" aria-label="模型控制面板"><section id="structure"><p id="intro" class="small"></p><label class="label" for="explode">结构拆解 <output id="amount">0%</output></label><input type="range" id="explode" aria-label="结构拆解" min="0" max="100" value="0"><button id="apart">展开结构</button><div id="operation" hidden><label class="label" for="stroke"><span id="stroke-label">机构行程</span> <output id="stroke-value">0%</output></label><input id="stroke" type="range" min="0" max="100" value="0" aria-label="机构行程"><button id="cycle">运行机构</button></div><label class="small" for="render-style">画面风格</label><select id="render-style"><option value="anatomy-light">细线插画</option><option value="studio">柔光实体</option></select><label class="check"><input type="checkbox" id="clay">白模检查</label><p class="small">先观察整体轮廓，再点选部件查看开口、连接和材质细节。</p></section><section id="components"><label class="small" for="component">选择部件</label><select id="component"></select><h2 id="part-title" class="detail-name"></h2><p id="part-note" class="detail-text"></p><button id="focus-part">查看部件</button><label class="check"><input id="isolate" type="checkbox">独立查看</label></section><section id="about"><h2 class="detail-name">模型说明</h2><p id="description" class="detail-text"></p><div id="connection-check" hidden><button id="check-connections">检查连接</button><p id="connection-result" class="small" role="status">按当前状态检查已声明的接口、行程和间隙。</p></div><p class="small">结构、功能和视觉分别验收。白模模式只改变材质，不能替代图纸核验。</p></section></aside></main><script type="module" src="studio.js"></script></body></html>
